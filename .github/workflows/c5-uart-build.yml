name: C5 UART RSSI builds

on:
  pull_request:
    paths:
      - "src/**"
      - "lib/**"
      - "platformio.ini"
      - "partitions.csv"
      - ".github/workflows/c5-uart-build.yml"
  push:
    branches:
      - "feature/c5-uart-rssi"
    paths:
      - "src/**"
      - "lib/**"
      - "platformio.ini"
      - "partitions.csv"
      - ".github/workflows/c5-uart-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - esp32-s3-zero-c5uart
          - esp32-s3-devkitc-1-c5uart
          - esp32-c3-devkitm-1-c5uart
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}
